<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1.0">
        <meta name="description" content="website description">
        <meta name="author" content="Iago Henrique">
        <meta name="viewport" content="Iago Henrique">
        <link rel="stylesheet" href="style.css">
        <title>Koenigsegg AMV</title>
    </head>
    <body>
        
        <header id="pageHead">
            <video id="meuVideo" src="Jesko Attack.mp4" type="video/mp4"></video>
            <input type="range" id="barraProgresso" value="0" min="0" max="100" step="0.1" style="width: 90%; margin-top: 15px;">
            <p style="margin-top: 20px">Tempo atual: <span id="displayTempo">00:00</span>s</p>
        </header>

        <br/>

        <div class="buttons">
            <button id="btnPlay">Play</button>
            <button id="btnPause">Pause</button>
            <button id="btnMaisVeloz">2X Speed</button>
            <button id="btnMenosVeloz">1X Speed</button>
            <button id="btnMutar">Mute</button>
            <button id="btnPularTempo">Skip +10s</button>
            <button id="btnVoltarTempo">Go Back -10s</button>

            <label for="volControl">Volume: </label>
            <input type="range" id="volControl" min="0" max="1" step="0.1" value="1">
        </div>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
        </style>

        <script src="function.js"></script>
        
    </body>
</html>
